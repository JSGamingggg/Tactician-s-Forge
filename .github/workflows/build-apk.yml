name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug & Optional Release APK
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SDK_DIR/licenses"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          fi
          if [ ! -f "$SDK_DIR/licenses/android-sdk-license" ]; then
            printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_DIR/licenses/android-sdk-license"
          fi
          if [ ! -f "$SDK_DIR/licenses/android-sdk-preview-license" ]; then
            printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-preview-license"
          fi

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -s debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ -s debug.keystore ]; then
            CURRENT_SHA1=$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android 2>/dev/null | grep -i 'SHA1:' | head -n 1 | awk '{print $2}' || true)
            if [ "$CURRENT_SHA1" != "38:09:6E:15:75:91:CA:9D:31:26:D1:B2:AD:79:B4:32:8D:BD:C8:D3" ]; then
              rm -f debug.keystore
            fi
          fi
          if [ ! -s debug.keystore ]; then
            DEFAULT_KEYSTORE_B64=""
            printf '%s' "$DEFAULT_KEYSTORE_B64" | base64 -d > debug.keystore
          fi

      - name: Prepare environment secrets (.env & Google Services)
        id: env_secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_SECRET: ${{ secrets.GITHUB_SECRET }}
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if grep -q '^GITHUB_REPO=' .env 2>/dev/null; then
            sed -i "s|^GITHUB_REPO=.*|GITHUB_REPO=${GITHUB_REPOSITORY}|" .env
          else
            echo "GITHUB_REPO=${GITHUB_REPOSITORY}" >> .env
          fi
          RESOLVED_GH_TOKEN="${GH_RELEASE_TOKEN:-${GITHUB_PAT:-${GH_TOKEN:-${GITHUB_SECRET:-}}}}"
          if [ -n "${RESOLVED_GH_TOKEN:-}" ]; then
            echo "::add-mask::${RESOLVED_GH_TOKEN}"
            if grep -q '^GITHUB_TOKEN=' .env 2>/dev/null; then
              sed -i "s|^GITHUB_TOKEN=.*|GITHUB_TOKEN=${RESOLVED_GH_TOKEN}|" .env
            else
              echo "GITHUB_TOKEN=${RESOLVED_GH_TOKEN}" >> .env
            fi
            if grep -q '^GH_RELEASE_TOKEN=' .env 2>/dev/null; then
              sed -i "s|^GH_RELEASE_TOKEN=.*|GH_RELEASE_TOKEN=${RESOLVED_GH_TOKEN}|" .env
            else
              echo "GH_RELEASE_TOKEN=${RESOLVED_GH_TOKEN}" >> .env
            fi
          fi
          if [ ! -s app/google-services.json ]; then
            if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              DEFAULT_GS_B64=""
              printf '%s' "$DEFAULT_GS_B64" | base64 -d > app/google-services.json
            fi
          fi

      - name: Compute App Release Metadata
        id: build_meta
        run: |
          VERSION_CODE=$((1 + GITHUB_RUN_NUMBER))
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
            VERSION_NAME="${RAW_TAG#v}"
          else
            VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          BUILD_TS_MS="$(date +%s)000"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_ts_ms=${BUILD_TS_MS}" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle 9.9.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.2'

      - name: Build Debug APK
        env:
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_SECRET: ${{ secrets.GITHUB_SECRET }}
        run: |
          RESOLVED_GH_TOKEN="${GH_RELEASE_TOKEN:-${GITHUB_PAT:-${GH_TOKEN:-${GITHUB_SECRET:-}}}}"
          gradle :app:assembleDebug --no-daemon \
            -PAPP_VERSION_CODE=${{ steps.build_meta.outputs.version_code }} \
            -PAPP_VERSION_NAME=${{ steps.build_meta.outputs.version_name }} \
            -PGIT_COMMIT_SHA=${{ github.sha }} \
            -PBUILD_TIMESTAMP_MS=${{ steps.build_meta.outputs.build_ts_ms }} \
            -PGITHUB_REPO=${{ github.repository }} \
            -PGITHUB_TOKEN="${RESOLVED_GH_TOKEN}"

      - name: Run Unit Tests
        continue-on-error: true
        timeout-minutes: 10
        run: gradle :app:testDebugUnitTest --no-daemon --console=plain

      - name: Upload Debug APK Artifact (if quota available)
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: tacticians-forge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
          if-no-files-found: error

      - name: Build Signed Release APK (when keystore secrets configured)
        id: release_build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_SECRET: ${{ secrets.GITHUB_SECRET }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            RESOLVED_GH_TOKEN="${GH_RELEASE_TOKEN:-${GITHUB_PAT:-${GH_TOKEN:-${GITHUB_SECRET:-}}}}"
            echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "$KEYSTORE_PATH"
            gradle :app:assembleRelease --no-daemon \
              -PAPP_VERSION_CODE=${{ steps.build_meta.outputs.version_code }} \
              -PAPP_VERSION_NAME=${{ steps.build_meta.outputs.version_name }} \
              -PGIT_COMMIT_SHA=${{ github.sha }} \
              -PBUILD_TIMESTAMP_MS=${{ steps.build_meta.outputs.build_ts_ms }} \
              -PGITHUB_REPO=${{ github.repository }} \
              -PGITHUB_TOKEN="${RESOLVED_GH_TOKEN}"
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping signed release APK (signing secrets not configured)."
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Release APK Artifact (if quota available)
        if: steps.release_build.outputs.built == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: tacticians-forge-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 1
          if-no-files-found: ignore

      - name: Update Rolling latest-apk Tag
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest-apk
          git push origin refs/tags/latest-apk --force || true

      - name: Publish Latest APK to GitHub Releases
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-apk
          name: "Tactician's Forge v${{ steps.build_meta.outputs.version_name }}"
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            Automated APK build for Tactician's Forge.
            Version: ${{ steps.build_meta.outputs.version_name }}
            BuildCode: ${{ steps.build_meta.outputs.version_code }}
            Commit: ${{ github.sha }}
          files: |
            app/build/outputs/apk/debug/*.apk

      - name: Attach Release APK to Latest Release (when built)
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v') && steps.release_build.outputs.built == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-apk
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/*.apk

      - name: Publish APK to GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            Release ${{ github.ref_name }} for Tactician's Forge.
            Version: ${{ steps.build_meta.outputs.version_name }}
            BuildCode: ${{ steps.build_meta.outputs.version_code }}
            Commit: ${{ github.sha }}
          files: |
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true

      - name: Attach Release APK to Tag Release (when built)
        if: startsWith(github.ref, 'refs/tags/v') && steps.release_build.outputs.built == 'true'
        uses: softprops/action-gh-release@v3
        with:
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/*.apk

